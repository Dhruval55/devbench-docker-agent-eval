name: eval

on:
  push:
  pull_request:

jobs:
  verifier-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python evaluation/run_benchmark.py --agent mock

